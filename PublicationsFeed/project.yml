name: PublicationsFeed
options:
  bundleIdPrefix: com.cyangradient
  developmentLanguage: en
  deploymentTarget:
    iOS: "16.0"
configs:
  Debug: debug
  Release: release
targets:
  PublicationsFeed:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: PublicationsFeed/Sources
      - path: PublicationsFeed/Resources
    info:
      path: PublicationsFeed/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cyangradient.publicationsfeed
        PRODUCT_NAME: PublicationsFeed
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
schemes:
  PublicationsFeed:
    build:
      targets:
        PublicationsFeed: all
    run:
      config: Debug
    archive:
      config: Release
