<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Publications Feed</title>
  <meta name="description" content="An auto-refreshing feed of articles from your favorite publications." />
  <meta name="theme-color" content="#161c2c" />

  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icons/icon-180.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Feed" />

  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="app-header">
    <div class="app-header-row">
      <h1>Feed</h1>
      <button id="sourcesButton" class="icon-button" aria-label="Publications" aria-haspopup="dialog">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
      </button>
    </div>
    <div class="app-header-status">
      <span id="statusText">Loading…</span>
      <button id="refreshButton" class="text-button" aria-label="Refresh now">Refresh</button>
    </div>
  </header>

  <main id="articleList" class="article-list" aria-live="polite"></main>

  <div id="emptyState" class="empty-state" hidden>
    <p>No articles yet.</p>
    <button id="emptyRefreshButton" class="text-button">Refresh</button>
  </div>

  <dialog id="sourcesDialog" class="sources-dialog">
    <div class="sources-dialog-header">
      <h2>Publications</h2>
      <button id="closeSourcesButton" class="text-button">Done</button>
    </div>
    <ul id="sourcesList" class="sources-list"></ul>
  </dialog>

  <script src="app.js" defer></script>
</body>
</html>
