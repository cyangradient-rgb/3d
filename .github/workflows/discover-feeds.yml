name: Discover feed URLs

on:
  workflow_dispatch:
    inputs:
      urls:
        description: "Space-separated site URLs to probe for their RSS/Atom feed"
        required: true
        type: string

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: publications-feed/scripts
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci

      - name: Discover feeds
        env:
          URLS: ${{ inputs.urls }}
        run: npm run discover -- $URLS
