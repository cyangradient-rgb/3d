<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Chip</title>
  <meta name="description" content="An auto-refreshing feed of articles from your favorite publications." />
  <meta name="theme-color" content="#faf8f4" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#14110d" media="(prefers-color-scheme: dark)" />

  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icons/icon-180.png" />
  <link rel="icon" href="favicon.ico" />
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png" />
  <link rel="icon" type="image/png" sizes="512x512" href="icons/icon-512.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Chip" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400&family=Instrument+Sans:wght@400&family=Instrument+Serif&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="app-header">
    <button id="sourcesButton" class="icon-button" aria-label="Sources" aria-haspopup="dialog">
      <img src="icons/header-icon.png" alt="" class="header-icon" />
    </button>
  </header>

  <span id="statusText" class="visually-hidden" aria-live="polite"></span>

  <main id="articleList" class="article-list" aria-live="polite"></main>

  <div id="emptyState" class="empty-state" hidden>
    <p>no articles yet</p>
    <button id="emptyRefreshButton" class="text-button">refresh</button>
  </div>

  <dialog id="sourcesDialog" class="sources-dialog">
    <div class="sources-dialog-header">
      <button id="closeSourcesButton" class="text-button">Done</button>
    </div>
    <div class="font-toggle-row">
      <div id="fontToggle" class="font-toggle" role="group" aria-label="Typeface">
        <button type="button" class="font-option" data-font="mono">Aa</button>
        <button type="button" class="font-option" data-font="serif">Aa</button>
        <button type="button" class="font-option" data-font="sans">Aa</button>
      </div>
    </div>
    <div id="sourcesList" class="sources-chips" role="group" aria-label="Filter by source"></div>
  </dialog>

  <dialog id="readerDialog" class="reader-dialog">
    <div class="reader-header">
      <button id="closeReaderButton" class="text-button">Done</button>
    </div>
    <article class="reader-article">
      <h1 id="readerTitle" class="reader-title"></h1>
      <div id="readerMeta" class="reader-meta"></div>
      <div id="readerBody" class="reader-body"></div>
      <a id="readerSourceLink" class="reader-source-link" target="_blank" rel="noopener noreferrer"></a>
    </article>
  </dialog>

  <script src="app.js" defer></script>
</body>
</html>
