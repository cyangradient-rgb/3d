<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Chip</title>
  <meta name="description" content="An auto-refreshing feed of articles from your favorite publications." />
  <meta name="theme-color" content="#ffffff" />

  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icons/icon-180.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Chip" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,200..800&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="app-header">
    <span class="wordmark">Chip</span>
    <button id="sourcesButton" class="text-button" aria-label="Publications" aria-haspopup="dialog">Sources</button>
  </header>

  <div class="status-row">
    <span id="statusText">loading</span>
    <button id="refreshButton" class="text-button" aria-label="Refresh now">Refresh</button>
  </div>

  <main id="articleList" class="article-list" aria-live="polite"></main>

  <div id="emptyState" class="empty-state" hidden>
    <p>no articles yet</p>
    <button id="emptyRefreshButton" class="text-button">Refresh</button>
  </div>

  <dialog id="sourcesDialog" class="sources-dialog">
    <div class="sources-dialog-header">
      <span class="wordmark">Sources</span>
      <button id="closeSourcesButton" class="text-button">Done</button>
    </div>
    <ul id="sourcesList" class="sources-list"></ul>
  </dialog>

  <script src="app.js" defer></script>
</body>
</html>
